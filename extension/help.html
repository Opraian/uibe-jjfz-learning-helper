<h1>UIBE jjfz 学习助手</h1>
<p>在综合课程列表点击“开始必修辅助”，按章节进入精品课程、必修和未完成视频。也可使用卡片上的辅助入口。</p>
<p>正常暂停后自动尝试继续播放。浏览器要求手动点击时，面板会显示续播按钮。异常、登录过期和验证提示会停止辅助。</p>
<p>每个标签页独立辅助。后台播放仍按平台原有规则处理。</p>
